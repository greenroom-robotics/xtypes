[workspace]
channels = [
  "http://localhost:12222/general",
  "https://prefix.dev/robostack-kilted",
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies]
ros-kilted-desktop = "*"
xtypes = { path = "." }
mise = "*"

[package]
name = "xtypes"
version = "1.1.2"
license = "Apache-2.0"

[package.build.backend]
name = "pixi-build-cmake"
version = ">=0.4,<0.5"

# Test env builds the library with tests enabled and runs ctest.
# xtypes is a plain-CMake header-only INTERFACE library (not ament/colcon),
# so this uses cmake/ctest directly rather than the colcon test pattern used
# by ROS packages. Tests are gated behind XTYPES_BUILD_TESTS and link GTest.
[feature.tests.dependencies]
cxx-compiler = "*"
cmake = "*"
ninja = "*"
gtest = "*"

[feature.tests.tasks]
test = "cmake -G Ninja -S . -B build/tests -DXTYPES_BUILD_TESTS=ON && cmake --build build/tests && ctest --test-dir build/tests --output-on-failure"

[environments]
tests = { features = ["tests"], no-default-feature = true }
