[workspace]
name = "xtypes"
channels = [
  "az://stgrcondachannel.blob.core.windows.net/general",
  "https://prefix.dev/robostack-kilted",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[package]
name    = "xtypes"
version = "1.1.2"
license = "Apache-2.0"

[dependencies.xtypes]
path   = "."
extras = ["test"]

[package.build.backend]
name    = "pixi-build-cmake"
version = "*"

# Plain-CMake header-only library, not ament: tests drive cmake/ctest directly.
[package.extra-dependencies.test]
cxx-compiler = "*"
cmake        = "*"
ninja        = "*"
gtest        = "*"

[tasks]
test = "cmake -G Ninja -S . -B build/tests -DXTYPES_BUILD_TESTS=ON && cmake --build build/tests && ctest --test-dir build/tests --output-on-failure"
